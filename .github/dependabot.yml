version: 2
updates:
  # Maven dependencies for every module
  - package-ecosystem: maven
    directories:
      - "/eureka-server"
      - "/simple-service"
      - "/spring-boot-config-server"
    schedule:
      interval: daily
      time: "21:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      # Spring Boot parent & Spring Cloud BOM move together across all modules
      spring:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "21:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
